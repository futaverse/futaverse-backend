services:
  redis:
    image: redis:7-alpine
    container_name: futaverse_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - REDIS_URL=${REDIS_URL}
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - redis

  celery:
    build: .
    command: celery -A futaverse worker --loglevel=info -E
    volumes:
      - .:/app
    environment:
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - redis

  flower:
    build: .
    command: celery -A futaverse flower --port=5555
    ports:
      - "5555:5555"
    volumes:
      - .:/app
    environment:
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - redis
      - celery

volumes:
  redis_data:
