services:
  - type: web
    name: futaverse-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn futaverse.wsgi:application
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

  - type: worker
    name: futaverse-qcluster
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py qcluster
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false